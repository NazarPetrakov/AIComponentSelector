<div
  class="container d-flex justify-content-center align-items-center"
  style="margin-top: 9rem"
>
  <div class="card p-4 shadow-lg" style="width: 400px">
    <h3 class="text-center mb-3">{{ "LOGIN.LOGIN" | translate }}</h3>

    <form (ngSubmit)="login()" [formGroup]="loginForm">
      <div class="mb-3">
        <label for="username" class="form-label">{{
          "LOGIN.USERNAME" | translate
        }}</label>
        <input
          type="text"
          id="username"
          class="form-control"
          formControlName="username"
          placeholder="{{ 'LOGIN.USERNAME' | translate }}"
          [class.is-invalid]="
            loginForm.get('username')?.invalid &&
            loginForm.get('username')?.touched
          "
        />
        <div
          class="invalid-feedback"
          *ngIf="
            loginForm.get('username')?.invalid &&
            loginForm.get('username')?.touched
          "
        >
          Username is required.
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">{{ 'LOGIN.PASSWORD' | translate }}</label>
        <div class="input-group">
          <input
            [type]="passwordVisible ? 'text' : 'password'"
            id="password"
            class="form-control"
            formControlName="password"
            placeholder="{{ 'LOGIN.ENTER_PASSWORD' | translate }}"
            [class.is-invalid]="
              loginForm.get('password')?.invalid &&
              loginForm.get('password')?.touched
            "
          />
          <span
            class="input-group-text"
            style="cursor: pointer"
            (click)="togglePassword()"
          >
            <i
              class="bi"
              [ngClass]="passwordVisible ? 'bi-eye-slash' : 'bi-eye'"
            ></i>
          </span>
        </div>
        <div
          class="invalid-feedback"
          *ngIf="
            loginForm.get('password')?.invalid &&
            loginForm.get('password')?.touched
          "
        >
          Password is required.
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center">
        <a routerLink="/register" class="text-primary"
          >{{ 'LOGIN.TO_REGISTER' | translate }}</a
        >
        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="loginForm.invalid"
        >
        {{ 'LOGIN.LOGIN' | translate }}
        </button>
      </div>
    </form>

    <div *ngIf="loginError" class="alert alert-danger mt-3">
      {{ loginError }}
    </div>
  </div>
</div>
