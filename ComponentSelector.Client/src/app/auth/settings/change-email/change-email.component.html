<div class="card shadow-sm">
  <div class="card-body">
    <h5 class="card-title">
      <i class="bi bi-envelope me-2"></i
      >{{ "SETTINGS.SIDE.CHANGE_EMAIL" | translate }}
    </h5>
    <hr />
    @if(accountService.user()){
    <div class="mb3">
      <label class="form-label fw-bold">{{
        "SETTINGS.CHANGE_EMAIL.CURRENT" | translate
      }}</label
      ><br />
      {{ accountService.user()?.email }}
    </div>
    <hr />
    <form
      #changeEmailForm="ngForm"
      (ngSubmit)="onSubmit(changeEmailForm)"
      novalidate
    >
      <div class="mb-3">
        <label class="form-label fw-bold">{{
          "SETTINGS.CHANGE_EMAIL.NEW" | translate
        }}</label>
        <input
          type="email"
          class="form-control"
          name="newEmail"
          [(ngModel)]="changeEmailData.newEmail"
          placeholder='{{ "SETTINGS.CHANGE_EMAIL.ENTER_NEW" | translate }}'
          required
          email
        />
        <div
          class="text-danger small"
          *ngIf="
            changeEmailForm.controls['newEmail']?.invalid &&
            changeEmailForm.controls['newEmail']?.touched
          "
        >
          <span
            *ngIf="changeEmailForm.controls['newEmail']?.errors?.['required']"
            >Email is required.</span
          >
          <span *ngIf="changeEmailForm.controls['newEmail']?.errors?.['email']"
            >Please enter a valid email.</span
          >
        </div>
      </div>

      <div class="d-flex justify-content-between gap-3">
        <button
          type="submit"
          class="btn btn-primary w-45"
          [disabled]="changeEmailForm.invalid"
        >
        {{ "SETTINGS.CHANGE_EMAIL.CHANGE" | translate }}
        </button>
      </div>
    </form>
    <div *ngIf="changeEmailErrors" class="alert alert-danger mt-3">
      <div [innerHTML]="changeEmailErrors"></div>
    </div>
    }
  </div>
</div>
