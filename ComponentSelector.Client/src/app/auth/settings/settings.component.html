<div class="container-fluid mt-2">
  <div class="row">
    <!-- Sidebar -->
    <div class="col-md-3 border-end">
      <div class="mb-4">
        @if (accountService.user()) {
        <div class="fw-bold">{{ accountService.user()?.userName }}</div>
        <div class="text-muted small">{{ accountService.user()?.email }}</div>
        }
      </div>

      <ul class="list-group">
        <a
          routerLink="profile"
          routerLinkActive="active"
          class="list-group-item list-group-item-action border-0"
        >
          <i class="bi bi-person-circle me-2"></i>Профіль користувача
        </a>
        <a
          routerLink="change-password"
          class="list-group-item list-group-item-action border-0"
        >
          <i class="bi bi-lock me-2"></i>Зміна пароля
        </a>
        <a
          routerLink="change-email"
          class="list-group-item list-group-item-action border-0"
        >
          <i class="bi bi-envelope me-2"></i>Зміна електронної пошти
        </a>
        <a
          routerLink="/settings"
          class="list-group-item list-group-item-action border-0"
        >
          <i class="bi bi-bell me-2"></i>Налаштування сповіщень
        </a>
        <a
          routerLink="/settings"
          class="list-group-item list-group-item-action border-0"
        >
          <i class="bi bi-cpu me-2"></i>Мої збірки ПК
        </a>
        <a
          routerLink="/settings"
          class="list-group-item list-group-item-action border-0"
        >
          <i class="bi bi-sliders me-2"></i>Фільтри підбору комплектуючих
        </a>
        <a
          routerLink="/settings"
          class="list-group-item list-group-item-action border-0"
        >
          <i class="bi bi-graph-up-arrow me-2"></i>Історія переглядів/аналізу
        </a>
        <a
          routerLink="/settings"
          class="list-group-item list-group-item-action border-0"
        >
          <i class="bi bi-download me-2"></i>Експорт конфігурацій
        </a>
        <a
          routerLink="/settings"
          class="list-group-item list-group-item-action border-0"
        >
          <i class="bi bi-gear me-2"></i>Інші налаштування
        </a>
      </ul>
    </div>

    <!-- Content -->
    <div class="col-md-9">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
