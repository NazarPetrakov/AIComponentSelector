<div class="card mb-3 shadow-sm border-start border-4 border-primary">
  <div class="card-header fw-bold bg-primary text-white">
    {{ title }}
  </div>
  <div class="card-body p-3">
    <p class="mb-2"><strong>Price:</strong> {{ price }}$</p>
    <div class="row row-cols-3 g-2">
      <div class="col" *ngFor="let char of characteristics">
        <div class="d-flex justify-content-between small border rounded p-1">
          <span>{{ char.attributeName }}</span>
          <span class="text-muted">{{ char.attributeValue }}</span>
        </div>
      </div>
    </div>
    <p class="mt-2">
      <strong>{{ "AI_PAGE.MAIN.COMPATIBILITY" | translate }}::</strong>
      {{ compatibility }}
    </p>
  </div>
</div>
